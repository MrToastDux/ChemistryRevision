g-left:15px}.question{font-size:23px;line-height:1.45;letter-spacing:-.4px;margin:18px 0 24px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:white;border:2px solid var(--line);border-radius:13px;padding:14px 16px;color:var(--ink);min-height:57px}.choice .letter{background:#f4f0f9;border-radius:6px;min-width:27px;height:27px;display:grid;place-items:center;font-size:12px;font-weight:750}.choice.selected{border-color:var(--green);background:#f2ecfb}.choice.correct{border-color:#398656;background:#eef8ec}.choice.wrong{border-color:#c86454;background:#fff1ed}.numberrow{display:flex;align-items:center;gap:12px}input{width:100%;border:2px solid var(--line);padding:16px;border-radius:12px;outline:none;font-size:24px;color:var(--ink);min-width:0}input:focus{border-color:var(--green)}.unit{font-weight:700;white-space:nowrap}.feedback{padding:20px;border-radius:14px;background:#edf7e9;margin-top:20px;line-height:1.6}.feedback.bad{background:#fff0e9}.feedback strong{display:block;margin-bottom:5px}.feedback p{margin:0}.footerrow{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:25px}.tag{font-size:12px;color:var(--muted)}.result{text-align:center;padding:15px 0}.medal{width:86px;height:86px;display:grid;place-items:center;margin:0 auto 20px;border-radius:50%;background:var(--lime);font-size:40px}.resultstats{display:flex;justify-content:center;gap:35px;margin:28px 0}.resultstats b{font-size:26px;display:block}.resultstats span{font-size:12px;color:var(--muted)}.reviewitem{border-top:1px solid var(--line);padding:17px 0;text-align:left}.reviewitem p{margin:5px 0;font-size:14px}.bottomnote{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}.actions{display:flex;gap:10px;flex-wrap:wrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:720px){main{padding:26px 18px 50px}.top{padding:15px 18px}.brand{font-size:18px}.sta .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:-15px 0 35px}.tabs button{border:0;background:transparent;padding:11px 16px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:700}.tabs button.active{background:#e9dff8;color:#553b85}.reading h3{margin:24px 0 9px}.reading h3:first-child{margin-top:0}.reading p{font-size:15px}.reading li{line-height:1.7;margin:5px 0}.worked{background:#f5f1fb;border:1px solid #e7ddf2;padding:17px 20px;border-radius:12px;margin:18px 0}.worked p{margin:8px 0 0}.formula{white-space:normal;overflow-wrap:anywhere;font-size:15px}.diagram{margin:22px 0;background:#faf8fd;border:1px solid var(--line);border-radius:14px;padding:18px}.diagram svg{width:100%;max-height:300px;display:block}.diagram figcaption{font-size:12px;line-height:1.6;color:var(--muted);margin-top:12px}.fullguide{max-width:870px;margin:auto}.fullguide .panel{padding:28px 32px}.guideindex{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.guideindex a,a{color:#694da5;text-underline-offset:3px}article{scroll-margin-top:95px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--muted)}dt{font-weight:750;margin-top:22px}dd{margin:6px 0 0;line-height:1.65;font-size:15px}.sources{font-size:13px}.sources p{font-size:13px}textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px;background:white}textarea{display:block;width:100%;resize:vertical;line-height:1.6}.examitem{border-top:1px solid var(--line);margin-top:22px;padding-top:22px}.qheading{display:flex;justify-content:space-between;gap:18px;line-height:1.7;margin-bottom:14px;font-size:15px}.marks{white-space:nowrap;font-weight:bold}.examchoices{display:grid;gap:8px}.examchoices label{display:flex;gap:12px;align-items:baseline;padding:7px;cursor:pointer}.examchoices input{width:16px;height:16px;flex-shrink:0;accent-color:var(--green)}.examitem .numberrow input{max-width:270px;font-size:18px}.scorepicker{display:flex;align-items:center;justify-content:flex-end;gap:12px;font-size:13px}.scorepicker select{padding:8px 12px}.useranswer{white-space:pre-wrap;overflow-wrap:anywhere}.memocard .worked b{font-size:14px}.memocard li{font-size:14px}.fullguide h1{margin-top:10px}.numberrow .unit{font-size:14px}.sectionbar>div{min-width:0}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9f83ce;outline-offset:3px}.storage-note{display:none}@media(max-width:720px){.tabs{margin:0 0 24px;gap:3px}.tabs button{padding:9px 10px;font-size:12px}.fullguide .panel{padding:22px 18px}.guideindex{grid-template-columns:1fr}.sectionbar{align-items:flex-start}.numberrow{flex-wrap:wrap}.numberrow input{flex:1;min-width:100px}.sectionbar .btn{flex-shrink:0}.diagram{padding:10px}.fullguide .sectionbar{flex-wrap:wrap}.fullguide h1{font-size:31px!important}.qheading{gap:10px}}@media print{header,.tabs,.noprint,button,input[type=radio],#definition-search,.bottomnote{display:none!important}body{background:white;color:black}main{padding:0;max-width:none}.panel,.fullguide .panel{border:0;border-radius:0;padding:0;margin:0 0 25px;box-shadow:none}h1{font-size:26px!important}h2{font-size:20px}h3{font-size:16px}.examgroup{break-before:page}.examgroup:first-of-type{break-before:auto}.examitem,.diagram,.worked{break-inside:avoid}.examchoices label{padding:3px 0}textarea{min-height:95px;border:1px solid #bbb}.numberrow input{border:1px solid #bbb;width:180px;height:42px;font-size:15px}.sectionbar{margin:0 0 18px}.formula,.worked{background:#f5f5f5;color:black}.guideindex{display:none}.sources a{font-size:11px}.fullguide{max-width:none}.useranswer{font-size:12px}a{color:black}}</style></head><body><header><div class="top"><div class="brand"><span class="logo" aria-hidden="true">⚗</span>chemistry sprint<span class="sr">Grade 10 Paper 2</span></div><div class="stats"><span class="xp" id="xp">0 XP</span><span id="hearts" aria-label="Five hearts">♥ ♥ ♥ ♥ ♥</span></div></div></header><main id="app"><h1>Chemistry Sprint</h1><p>Opening your lessons…</p><noscript>This interactive app needs JavaScript. Enable JavaScript in your browser to use the lessons and quizzes.</noscript></main><script>
const {lessons,glossary,elements,exam}={"lessons":[{"title":"Matter & classification","topic":"Revision of matter and classification","desc":"Elements, compounds and mixtures.","sections":[["Start with matter","Matter has mass and occupies space. A pure substance has a fixed chemical composition and characteristic properties. An element contains one kind of atom, such as copper or oxygen. Oxygen gas, O₂, is still an element: each molecule contains only oxygen atoms. A compound contains atoms of two or more different elements chemically bonded in a fixed ratio, such as H₂O or NaCl."],["Mixtures","A mixture contains two or more substances physically combined in variable proportions. Each component retains its chemical identity. A homogeneous mixture is uniform throughout at the scale considered: air or salt solution. A heterogeneous mixture is non-uniform: sand in water or granite. A solution is a homogeneous mixture of a solute dissolved in a solvent."],["How to separate them","Use physical properties: filtration separates an insoluble solid from a liquid; evaporation recovers a dissolved solid; distillation separates using differences in volatility/boiling point and allows collection of condensed liquid; chromatography separates components by their different movement between phases; a magnet can remove iron from sand. Filtration cannot remove dissolved salt from water. Compounds require chemical change to decompose into simpler substances."],["Material properties","Density is mass per unit volume: ρ = m/V. Malleable means able to be hammered into sheets; ductile means able to be drawn into wire; brittle means tending to fracture rather than deform. Metals generally conduct heat and electricity; many non-metals are insulators, with exceptions such as graphite. Silicon is a semiconductor. Iron, cobalt and nickel are common magnetic metals; not all metals are magnetic."]],"formula":"Matter → pure substance OR mixture\nPure substance → element OR compound\nMixture → homogeneous OR heterogeneous\nDensity: ρ = m/V","tip":"A molecule can be an element (O₂) or a compound (H₂O). Dissolving does not automatically make a compound.","worked":"Salt water is a homogeneous mixture. To collect pure water, distil it: boil, cool the vapour, and collect the condensed water. To recover the salt, evaporate the water.","qs":[{"q":"Which sample is a pure compound?","options":["Air","Copper","Distilled water","Salt water"],"answer":2,"why":"Water contains hydrogen and oxygen chemically bonded in a fixed ratio, H₂O. Copper is an element; air and salt water are mixtures."},{"q":"O₂ is classified as…","options":["A compound because it has two atoms","An element because it contains one kind of atom","A heterogeneous mixture","An ionic substance"],"answer":1,"why":"The number of atoms is not the test. O₂ contains only oxygen atoms, so it is an element."},{"q":"Which method collects water from salt solution?","options":["Filtration","A magnet","Distillation","Sieving"],"answer":2,"why":"Water vaporises and is condensed into a separate container. Dissolved salt passes through ordinary filter paper."},{"q":"A homogeneous mixture has…","options":["A chemically fixed ratio","A uniform composition throughout","Only one kind of atom","No particles"],"answer":1,"why":"A homogeneous mixture is uniform throughout but its proportions may vary between samples."},{"q":"A sample has mass 54 g and volume 20 cm³. Calculate its density.","answer":2.7,"unit":"g/cm³","why":"ρ = m/V = 54/20 = 2.70 g/cm³.","tolerance":0.013500000000000002}]},{"title":"States & the particle model","topic":"States of matter and kinetic molecular theory","desc":"Explain what particles are doing.","sections":[["The kinetic molecular theory","Matter is made of tiny particles with spaces between them. Particles are in constant motion, interact through attractive forces, and have kinetic energy. Temperature is related to their average kinetic energy. Heating a sample within one phase generally increases average kinetic energy and particle motion; it does not make the individual particles grow in size."],["Solid, liquid and gas","A solid has a fixed shape and volume: its particles are closely packed and vibrate around fixed positions. A liquid has a fixed volume but takes its container’s shape: its particles remain close but move past one another. A gas has no fixed shape or volume: particles are far apart and move rapidly and randomly, filling the available space. Gases compress readily because there is lots of space between particles."],["Diffusion and Brownian motion","Diffusion is the net spreading of particles from a region of higher concentration to lower concentration due to random motion. Perfume spreading through air is an example. It generally happens faster at higher temperature. Brownian motion is the irregular motion of tiny suspended particles due to uneven collisions by the surrounding fluid particles. Both support the particle model."],["Gas pressure","Gas particles collide with container walls. These collisions exert forces and create pressure. Heating a fixed amount of gas in a rigid container increases average particle speed and makes collisions with the walls more frequent and more forceful on average, so pressure increases. This explanation requires fixed volume; do not assume pressure must rise in a freely expanding container."]],"formula":"Temperature ↑ → average kinetic energy ↑\nGas pressure comes from collisions with walls.","tip":"Solid particles DO move: they vibrate. Heating does not enlarge atoms; it can increase average spacing.","worked":"Why can a gas be compressed much more than a liquid? Gas particles have large spaces between them. Compression reduces these spaces. Liquid particles are already close together.","qs":[{"q":"In a solid, particles…","options":["Never move","Vibrate around fixed positions","Are very far apart","Have no attraction"],"answer":1,"why":"A solid’s particles have kinetic energy and vibrate, although they cannot freely move through the solid."},{"q":"Why is a gas easily compressed?","options":["Its atoms shrink","Its particles have large spaces between them","It contains no particles","Its particles stop moving"],"answer":1,"why":"Compression mainly reduces the space between particles, rather than shrinking particles."},{"q":"Increasing temperature within a single phase generally increases…","options":["The size of each atom","Average particle kinetic energy","The number of protons","The mass of each molecule"],"answer":1,"why":"Temperature is related to average kinetic energy, not atomic size."},{"q":"Perfume gradually spreading across a room is…","options":["Condensation","Diffusion","Freezing","Chemical decomposition"],"answer":1,"why":"Random particle motion produces net spreading from higher to lower concentration."},{"q":"A gas in a sealed rigid container is heated. Its pressure rises mainly because…","options":["The gas turns into extra atoms","Wall collisions become more frequent and more forceful on average","The container loses all its particles","Gravity increases"],"answer":1,"why":"Faster-moving particles collide with the walls more frequently and transfer more momentum per collision on average."}]},{"title":"Phase changes & curves","topic":"States of matter and kinetic molecular theory","desc":"What happens on a plateau?","sections":[["Name the changes","Melting: solid → liquid. Freezing: liquid → solid. Vaporisation: liquid → gas. Condensation: gas → liquid. Sublimation: solid → gas directly. Deposition: gas → solid directly. Melting, vaporisation and sublimation absorb energy; the reverse changes release energy."],["Boiling versus evaporation","Evaporation happens at the surface of a liquid and can occur below its boiling point. Some high-energy surface particles escape; the remaining liquid can cool. Boiling occurs throughout the liquid at its boiling temperature for the prevailing pressure, with vapour bubbles forming in the liquid. Boiling point depends on pressure."],["Reading a heating curve","A graph has temperature vertically and time or energy added horizontally. On a sloped segment, one phase is warming: average kinetic energy increases. For a pure substance undergoing a phase change at constant pressure, a flat segment shows constant temperature while energy is absorbed. The energy increases potential energy by overcoming attractions rather than increasing average kinetic energy. Solid and liquid coexist during melting; liquid and gas coexist during boiling."],["Cooling and identifying phases","On cooling plateaus, energy is released as attractions form, while temperature remains constant in the ideal pure-substance model. Below melting point the substance is solid; between melting and boiling points it is liquid; above boiling point it is gas. Exactly at a transition temperature, two phases may coexist, so temperature alone does not fix the proportions. In molecular substances, boiling separates molecules; it does not break the covalent bonds within them."]],"formula":"Sloped section: temperature and average kinetic energy change.\nPlateau: phase changes; potential energy changes.","tip":"On a melting plateau, energy is still entering even though temperature stays constant. Use the pressure and pure-substance assumptions.","worked":"A substance melts at −10 °C and boils at 60 °C at the stated pressure. At −20 °C it is solid; at 25 °C it is liquid; at 80 °C it is gas.","diagram":"heating","qs":[{"q":"On the melting plateau of a pure substance at constant pressure, temperature…","options":["Rises steadily","Stays constant while energy is absorbed","Falls to zero","Equals room temperature for every substance"],"answer":1,"why":"The added energy changes the particle arrangement/potential energy rather than average kinetic energy."},{"q":"The direct change from solid to gas is…","options":["Condensation","Deposition","Sublimation","Melting"],"answer":2,"why":"Sublimation bypasses the liquid phase. Deposition is the reverse."},{"q":"Which statement about evaporation is correct?","options":["It happens only at boiling point","It happens at the surface and can occur below boiling point","It always breaks water into hydrogen and oxygen","It occurs only in a sealed container"],"answer":1,"why":"Evaporation involves particles escaping the surface. Boiling occurs throughout the liquid."},{"q":"A substance melts at −10 °C and boils at 60 °C. At 25 °C it is…","options":["Solid","Liquid","Gas","Definitely solid and gas"],"answer":1,"why":"25 °C lies above its melting point and below its boiling point at the stated pressure."},{"q":"When water boils, which interaction is overcome to separate water molecules?","options":["O–H covalent bonds inside each molecule","Attractions between water molecules","Bonds inside oxygen nuclei","All electron–proton attractions"],"answer":1,"why":"Boiling leaves H₂O molecules chemically intact. It separates molecules by overcoming intermolecular attractions."}]},{"title":"The atom & ions","topic":"The atom: basic building blocks of materials","desc":"Count protons, neutrons and electrons.","sections":[["Atomic structure","An atom has a very small, dense nucleus containing protons and neutrons, with electrons in the space around it. A proton has relative charge +1 and relative mass about 1; a neutron has charge 0 and relative mass about 1; an electron has charge −1 and a much smaller mass. Most atomic mass is in the nucleus; most atomic volume is outside it."],["Atomic number and mass number","Atomic number Z is the number of protons in the nucleus. It identifies the element. Mass number A is the number of protons plus neutrons in one atom’s nucleus. Thus neutrons = A − Z. In nuclear notation, A is upper left and Z lower left of the element symbol. Do not confuse an isotope’s whole-number mass number with a periodic-table weighted relative atomic mass."],["Neutral atoms and ions","A neutral atom has equal proton and electron numbers. An ion is a charged particle formed by electron loss or gain. Losing electrons gives a positive cation; gaining electrons gives a negative anion. For charge expressed in elementary-charge units: charge = protons − electrons. Protons do not change in ordinary ion formation."],["Count with care","For ²³₁₁Na: 11 protons, 12 neutrons and 11 electrons if neutral. For ²³₁₁Na⁺: protons and neutrons stay the same, but there are 10 electrons. A 2+ charge means two fewer electrons, not two additional protons. A 2− ion has two extra electrons."]],"formula":"Z = protons     A = protons + neutrons\nNeutrons = A − Z\nIon charge = protons − electrons","tip":"Changing electron count changes charge. Changing proton count changes the element.","worked":"For ²⁴₁₂Mg²⁺: p = 12; n = 24 − 12 = 12; e = 12 − 2 = 10.","qs":[{"q":"An atom has Z = 17 and A = 35. How many neutrons does it have?","answer":18,"unit":"neutrons","why":"Neutrons = A − Z = 35 − 17 = 18.","tolerance":0},{"q":"A ²⁴₁₂Mg²⁺ ion has how many electrons?","answer":10,"unit":"electrons","why":"Neutral magnesium has 12 electrons. It loses two to form Mg²⁺, leaving 10.","tolerance":0},{"q":"Which particle determines the identity of an element?","options":["Electron","Neutron","Proton","Molecule"],"answer":2,"why":"Atomic number is proton number. Changing it changes which element you have."},{"q":"An anion forms when an atom…","options":["Gains electrons","Loses electrons","Gains ordinary protons","Loses all neutrons"],"answer":0,"why":"Extra electrons give a negative charge: an anion."},{"q":"A particle has 13 protons and 10 electrons. Find its signed charge in elementary-charge units.","answer":3,"unit":"e","why":"Charge = 13 − 10 = +3, so it is a 3+ cation.","tolerance":0}]},{"title":"Isotopes & electron filling","topic":"The atom: basic building blocks of materials","desc":"From shells to orbital diagrams.","sections":[["Isotopes","Isotopes are atoms of the same element with the same proton number but different neutron numbers. They therefore have different mass numbers. Their neutral atoms have the same electron arrangement and broadly similar chemical behaviour. Relative atomic mass Aᵣ is the weighted mean atomic mass of an element’s atoms relative to one twelfth of the mass of a carbon-12 atom. It has no unit."],["Weighted averages","Multiply each isotopic mass by its fractional abundance and add. Percentages must first be divided by 100. If a school question gives only mass numbers, use them as the stated approximation. An element’s relative atomic mass lies between the isotope masses and closer to the more abundant isotope."],["Orbitals and filling","An orbital is a region of space where there is a high probability of finding an electron. It is not a fixed circular path. Up to Z = 20, use the order 1s, 2s, 2p, 3s, 3p, 4s. An s subshell has one orbital and holds up to 2 electrons. A p subshell has three orbitals and holds up to 6. Each orbital holds at most two electrons with opposite spins (Pauli principle). Fill equal-energy p orbitals singly before pairing (Hund’s rule). Fill lowest-energy orbitals first (Aufbau principle)."],["Valence and core electrons","Valence electrons are in the outermost occupied energy level for the main-group atoms studied here. Core electrons are the inner electrons. Sodium is 1s² 2s² 2p⁶ 3s¹, or shell arrangement 2,8,1: one valence electron. Calcium is 1s² 2s² 2p⁶ 3s² 3p⁶ 4s², or 2,8,8,2. For these first-20 ground-state atoms, 4s fills before 3d."]],"formula":"Aᵣ = Σ(isotopic mass × fractional abundance)\nFilling order to Z = 20: 1s → 2s → 2p → 3s → 3p → 4s","tip":"Mass number A is for one isotope; relative atomic mass Aᵣ is a weighted average. Both differ from molar mass, which has units g/mol.","worked":"A simplified chlorine sample is 75% chlorine-35 and 25% chlorine-37. Aᵣ ≈ (0.75 × 35) + (0.25 × 37) = 35.5.","diagram":"orbitals","qs":[{"q":"Isotopes of the same element have…","options":["Different proton numbers","The same protons but different neutrons","The same neutrons but different protons","Different atomic numbers"],"answer":1,"why":"Same element means same proton number. Isotopes differ in neutron number and mass number."},{"q":"A sample is 75% isotope-35 and 25% isotope-37. Use mass numbers to find approximate relative atomic mass.","answer":35.5,"unit":"(no unit)","why":"Aᵣ = 0.75 × 35 + 0.25 × 37 = 35.5.","tolerance":0.1775},{"q":"Which ground-state configuration is correct for sodium (Z = 11)?","options":["1s² 2s² 2p⁶ 3s¹","1s² 2s² 2p⁷","1s² 2s² 2p⁵ 3s²","1s² 2s² 2p⁶ 4s¹"],"answer":0,"why":"Fill lower-energy orbitals first. 2 + 2 + 6 + 1 = 11 electrons."},{"q":"How many electrons can a complete p subshell hold?","answer":6,"unit":"electrons","why":"Three p orbitals × two electrons per orbital = six electrons.","tolerance":0},{"q":"Hund’s rule says equal-energy orbitals are filled…","options":["By pairing in one before using others","Singly with parallel spins before pairing","With three electrons each","Only after all higher levels"],"answer":1,"why":"For example, three 2p electrons occupy three separate 2p orbitals before any pair forms."}]},{"title":"The periodic table","topic":"The periodic table","desc":"Find the pattern behind the position.","sections":[["Groups and periods","The modern periodic table arranges elements by increasing atomic number. A group is a vertical column; a period is a horizontal row. For the main-group elements, atoms in the same group have the same number of valence electrons and similar chemical properties. Period number gives the highest occupied principal energy level in the neutral ground-state atom."],["Families and ions","Group 1 alkali metals commonly form +1 ions; Group 2 alkaline earth metals +2; Group 17 halogens −1; Group 16 non-metals often −2. Group 18 noble gases have full outer shells: helium has two outer electrons; the others commonly studied have eight. Hydrogen is in Group 1 but is a non-metal and is not an alkali metal."],["Position from configuration","Main groups 1 and 2 have one and two valence electrons. Groups 13–18 generally have three to eight valence electrons, except helium. Chlorine: 2,8,7 → period 3, group 17. Magnesium: 2,8,2 → period 3, group 2. Do not call chlorine Group 7 when the table uses modern 1–18 numbering."],["Trends and materials","Across a period from left to right, atomic radius generally decreases as nuclear charge increases while electrons are added to the same main energy level. Down a group, radius increases because occupied levels are added. Across a period, electronegativity and first ionisation energy generally increase; down a group they generally decrease, with exceptions. Electronegativity is attraction for bonding electrons; ionisation energy is energy needed to remove an electron from a gaseous atom. Metals mostly lie left/centre, non-metals towards the upper right, and metalloids along the stepped boundary."]],"formula":"Period → occupied principal energy levels\nMain group → valence electrons → likely ion","tip":"Use the group labels printed on your periodic table. Noble gases do not all have eight outer electrons: helium has two.","worked":"An atom with electron arrangement 2,8,2 has 12 electrons and Z = 12 if neutral. It is magnesium, in period 3 and group 2, and tends to lose two electrons to form Mg²⁺.","qs":[{"q":"A group is a…","options":["Horizontal row","Vertical column","List ordered by mass number","Collection of isotopes only"],"answer":1,"why":"Groups are vertical columns; periods are horizontal rows."},{"q":"An atom with configuration 2,8,7 is in…","options":["Period 7, group 3","Period 3, group 17","Period 2, group 7","Period 3, group 18"],"answer":1,"why":"Three occupied shells → period 3; seven valence electrons → group 17."},{"q":"A Group 2 metal commonly forms…","options":["A 2− ion","A 1+ ion","A 2+ ion","No ion because it is a noble gas"],"answer":2,"why":"It typically loses its two valence electrons to form a 2+ cation."},{"q":"Atomic radius generally increases down a group because…","options":["All atoms lose their nuclei","More occupied energy levels are added","The number of shells decreases","Protons disappear"],"answer":1,"why":"Additional occupied shells increase atomic size."},{"q":"Which element is a metalloid and semiconductor?","options":["Sodium","Silicon","Neon","Chlorine"],"answer":1,"why":"Silicon is a metalloid used as a semiconductor. Its conductivity generally increases with temperature."}]},{"title":"Ionic bonding & formulae","topic":"Chemical bonding","desc":"Transfer electrons. Balance charge.","sections":[["Bonding and ions","A chemical bond is an attractive interaction that holds atoms or ions together in a substance. Ionic bonding is the electrostatic attraction between oppositely charged ions. Electron transfer creates those ions; the attraction between them is the bond. It commonly occurs between a metal and a non-metal. Sodium loses one electron; chlorine gains one; Na⁺ and Cl⁻ attract in a crystal lattice."],["Writing neutral formulae","The total positive and negative charges in a neutral ionic compound must balance. Mg²⁺ needs two Cl⁻ ions: MgCl₂. Al³⁺ and O²⁻ require the lowest common total charge of six: two Al³⁺ and three O²⁻, giving Al₂O₃. Reduce to the simplest whole-number ion ratio: Mg²⁺ and O²⁻ give MgO, not Mg₂O₂. A formula unit is the simplest whole-number ratio of ions in an ionic compound; NaCl is not a discrete molecule in the crystal."],["Polyatomic ions","Some ions contain covalently bonded atoms and an overall charge. Know NH₄⁺ (ammonium), OH⁻ (hydroxide), NO₃⁻ (nitrate), SO₄²⁻ (sulfate) and CO₃²⁻ (carbonate), and use the ion table supplied. Calcium nitrate is Ca(NO₃)₂: brackets multiply the entire nitrate group. Aluminium sulfate is Al₂(SO₄)₃. Never change the formula inside a polyatomic ion to balance charge."],["Lewis diagrams and properties","Use dots or crosses to show valence electrons, with different symbols distinguishing atom origins if needed. Draw final ions in square brackets with charges outside. A sodium cation has lost its outer electron; a chloride anion has a complete octet. Ionic solids usually have high melting points because strong attractions extend throughout the lattice. They do not conduct when solid because ions are fixed, but molten ionic substances and aqueous solutions conduct when ions can move."]],"formula":"Total positive charge + total negative charge = 0\nMg²⁺ + 2Cl⁻ → MgCl₂\n2Al³⁺ + 3O²⁻ → Al₂O₃","tip":"Do not describe an ionic bond as “electron transfer” alone. The bond is electrostatic attraction between opposite ions.","worked":"Calcium is Ca²⁺ and nitrate is NO₃⁻. Two nitrate ions balance one calcium ion, so Ca(NO₃)₂ contains 1 Ca, 2 N and 6 O atoms per formula unit.","diagram":"ionic","qs":[{"q":"An ionic bond is…","options":["A shared pair of neutrons","Electrostatic attraction between opposite ions","Attraction between neutral gas molecules only","An electron by itself"],"answer":1,"why":"Electron transfer forms ions. Attraction between the resulting opposite ions is ionic bonding."},{"q":"What is the formula formed from Mg²⁺ and Cl⁻?","options":["MgCl","Mg₂Cl","MgCl₂","Mg₂Cl₂"],"answer":2,"why":"One +2 magnesium ion needs two −1 chloride ions to make zero total charge."},{"q":"What is the simplest formula from Al³⁺ and O²⁻?","options":["AlO","Al₂O₃","Al₃O₂","AlO₃"],"answer":1,"why":"2 × (+3) + 3 × (−2) = 0."},{"q":"How many oxygen atoms are represented in one formula unit of Ca(NO₃)₂?","answer":6,"unit":"O atoms","why":"The outside 2 multiplies the whole NO₃ group: 3 × 2 = 6 oxygen atoms.","tolerance":0},{"q":"Why does molten sodium chloride conduct electricity?","options":["Its protons move between atoms","Its ions can move and carry charge","It contains only neutral molecules","It has no electrostatic attractions"],"answer":1,"why":"Mobile ions carry current in molten salts. In solid NaCl, the ions are fixed in the lattice."}]},{"title":"Covalent & metallic bonding","topic":"Chemical bonding","desc":"Shared pairs and mobile electrons.","sections":[["Covalent bonds","A covalent bond involves a shared pair of electrons attracted to the nuclei of both bonded atoms. It commonly forms between non-metal atoms. A single bond shares one pair; a double bond shares two pairs; a triple bond shares three pairs. A molecule is a discrete group of atoms held together by covalent bonds. Not every covalent substance consists of separate molecules: diamond is a network."],["Draw Lewis structures","Count all valence electrons. Arrange atoms, usually putting the less electronegative atom in the centre; hydrogen is terminal. Join atoms with single bonds (two electrons each), complete outer atoms’ shells, then place remaining electrons on the central atom. For these simple examples, H needs two electrons and most other atoms aim for eight. If needed, convert lone pairs to shared pairs to make multiple bonds. Do not add extra electrons beyond your total."],["Useful examples","H₂: one bond. HCl: one bond and three lone pairs on Cl. H₂O: two O–H bonds and two lone pairs on O. NH₃: three N–H bonds and one lone pair on N. CH₄: four C–H bonds and no lone pairs on C. O₂ has a double bond and two lone pairs on each O. N₂ has a triple bond and one lone pair on each N. The octet rule is a useful pattern here, not a universal law for all chemistry."],["Metallic bonding","Metallic bonding is electrostatic attraction between positive metal ion cores and delocalised valence electrons. The mobile electrons explain electrical and thermal conduction. Metal layers can slide while metallic attraction remains, explaining malleability and ductility. Metal properties vary; do not claim all metals have the same melting point. Simple molecular substances often have low melting points because forces between molecules are much weaker than covalent bonds inside molecules."]],"formula":"Single bond = 1 shared pair\nDouble bond = 2 shared pairs\nTriple bond = 3 shared pairs","tip":"Lewis diagrams show VALENCE electrons. Separate strong bonds within a molecule from weaker attractions between molecules.","worked":"H₂O has 6 + 1 + 1 = 8 valence electrons. Two O–H bonds use 4; the remaining 4 form two lone pairs on oxygen. Both H atoms have a duet and O has an octet.","diagram":"water","qs":[{"q":"A covalent bond involves…","options":["Transfer of protons","A shared pair of electrons attracted to both nuclei","Only opposite ions in a lattice","No electrons"],"answer":1,"why":"The shared electrons are attracted to both atomic nuclei."},{"q":"How many shared electron pairs form the bond in N₂?","answer":3,"unit":"pairs","why":"Nitrogen has a triple bond: three shared pairs, or six bonding electrons.","tolerance":0},{"q":"How many lone pairs are on the oxygen in a water molecule?","answer":2,"unit":"lone pairs","why":"Water has 8 total valence electrons. Two bonds use 4 electrons; 4 remain as two lone pairs on O.","tolerance":0},{"q":"Metallic bonding is attraction between…","options":["Positive metal ion cores and delocalised electrons","Neutral molecules and water only","Positive protons and neutrons only","Negative ions only"],"answer":0,"why":"Mobile delocalised electrons hold the positive metal ion cores together."},{"q":"Why are metals usually good electrical conductors?","options":["Their neutrons drift freely","Their delocalised electrons can move","Their nuclei have no charge","They contain no bonds"],"answer":1,"why":"Mobile electrons transport charge through the metal."}]},{"title":"Particles & substance structures","topic":"Particles that substances are made up of","desc":"Atoms, molecules and giant networks.","sections":[["Choose the right particle","Some substances consist of separate atoms: helium, neon and argon are monatomic gases. Some consist of molecules: H₂, N₂, O₂, F₂, Cl₂, Br₂ and I₂ are familiar diatomic elements; H₂O and CO₂ are molecular compounds. A molecular formula gives the actual number of each kind of atom in one molecule."],["Giant ionic and metallic structures","Solid NaCl is a giant lattice of Na⁺ and Cl⁻ ions, not a collection of NaCl molecules. Its formula gives an ion ratio. Metals have extended structures with delocalised electrons; a copper sample is not a collection of Cu₂ molecules. When counting “particles”, identify whether the question means atoms, molecules, ions or formula units."],["Covalent networks","Diamond is a giant covalent network in which each carbon bonds to four others; it is very hard and has no mobile electrons for ordinary electrical conduction. Graphite has carbon sheets with three bonds per carbon and delocalised electrons; it conducts along the sheets, and weaker attractions between sheets allow them to slide. Silicon dioxide, SiO₂, is a network with a 1:2 atom ratio, not separate SiO₂ molecules in ordinary quartz."],["Three ways of describing chemistry","Macroscopic: what you observe, such as a colour change or melting. Submicroscopic: atoms, molecules, ions and their interactions. Symbolic: formulae and equations. A good explanation connects all three. In particle diagrams, identical coloured spheres represent the same element; touching linked spheres can represent bonded atoms. A pure compound can consist of identical molecules containing more than one kind of atom."]],"formula":"O₂ → molecules of an element\nCO₂ → molecules of a compound\nNaCl → ionic lattice / formula units\nDiamond → giant covalent network","tip":"“Compound” does not mean “molecule”. NaCl is a compound but its solid structure is ionic.","worked":"One mole of H₂O contains Nₐ water molecules, 2Nₐ hydrogen atoms and Nₐ oxygen atoms: 3Nₐ atoms in total. One mole of NaCl corresponds to Nₐ formula units, containing Nₐ Na⁺ and Nₐ Cl⁻ ions.","qs":[{"q":"Which consists of separate monatomic particles?","options":["Helium","Oxygen gas, O₂","Water","Sodium chloride crystal"],"answer":0,"why":"Helium is a noble gas consisting of individual atoms."},{"q":"The particles in a sodium chloride crystal are…","options":["Separate NaCl molecules","Na⁺ and Cl⁻ ions in a lattice","Only neutral chlorine atoms","Water molecules"],"answer":1,"why":"NaCl is a formula-unit ratio for an extended ionic structure."},{"q":"Diamond is best described as…","options":["A simple molecular solid","A giant covalent network","A liquid metal","An ionic crystal"],"answer":1,"why":"Each carbon is covalently bonded into a large three-dimensional network."},{"q":"Why can graphite conduct electricity?","options":["It has delocalised electrons in its sheets","Its carbon nuclei move freely","All covalent substances conduct","It consists only of ions"],"answer":0,"why":"Some electrons are delocalised within each carbon sheet and can carry charge."},{"q":"How many atoms in total are in one molecule of CO₂?","answer":3,"unit":"atoms","why":"One carbon atom plus two oxygen atoms gives three atoms per molecule.","tolerance":0}]},{"title":"Physical & chemical change","topic":"Physical and chemical change","desc":"New arrangement or new substance?","sections":[["Physical change","A physical change does not change the chemical identity of the substances involved. Examples include melting ice, boiling water, crushing a crystal and physically mixing iron with sulfur. In melting water, molecules become less regularly arranged and more mobile, but remain H₂O. Reversibility can be a clue but is not the defining test."],["Chemical change","A chemical change produces one or more new substances with different chemical identities. Atoms rearrange as bonds break and form. Rusting iron, burning magnesium and decomposing hydrogen peroxide are examples. Gas formation, a new precipitate, an unexpected colour change or an energy change may be evidence, but no single observation proves a chemical reaction in every case: boiling also gives bubbles."],["Mass and atoms","In an ordinary chemical reaction, the number of atoms of each element is conserved. Atoms are rearranged, not created or destroyed. Total mass is conserved in a closed system. An open container may appear to lose mass if a gaseous product escapes; counting the escaped gas restores the mass balance. The total number of molecules need not remain constant."],["Constant composition and energy","The law of constant composition states that a given pure compound always contains the same elements in the same fixed proportion by mass. Water has H:O mass ratio 2:16 = 1:8 using H = 1 and O = 16. Breaking bonds requires energy; forming bonds releases energy. Exothermic changes release energy to surroundings; endothermic changes absorb it. Both physical and chemical changes can involve energy transfer."]],"formula":"Closed-system mass: reactants = products\nAtoms of EACH element are conserved.\nPure compound → fixed mass ratio of elements.","tip":"Do not define physical change as “reversible” or chemical change as “irreversible”. Focus on whether new substances form.","worked":"12 g carbon combines completely with 32 g oxygen in a closed system to form carbon dioxide. Product mass = 12 + 32 = 44 g. In 2H₂ + O₂ → 2H₂O, molecules go from 3 to 2, but atoms are conserved.","qs":[{"q":"Which is a physical change?","options":["Iron rusting","Magnesium burning","Ice melting","Hydrogen peroxide decomposing"],"answer":2,"why":"Ice and liquid water both contain H₂O molecules. No new chemical substance forms."},{"q":"The defining feature of chemical change is…","options":["It must be irreversible","It must produce a loud sound","New substances form","It always loses total mass"],"answer":2,"why":"The chemical identities change; reversibility is not the defining test."},{"q":"12 g of carbon reacts completely with 32 g of oxygen in a closed system. Find product mass.","answer":44,"unit":"g","why":"Conservation of mass: total product mass = 12 + 32 = 44 g.","tolerance":0.22},{"q":"During an ordinary chemical reaction, which must be conserved?","options":["Number of molecules","Number of atoms of each element","Number of separate substances","Volume in every phase"],"answer":1,"why":"Atoms rearrange; the total number of molecules can change."},{"q":"The law of constant composition says a pure compound…","options":["Can contain any mass ratio of its elements","Always has the same elements in fixed proportions by mass","Must contain only one element","Can only be a gas"],"answer":1,"why":"For example, pure water has a fixed hydrogen-to-oxygen mass ratio of about 1:8."}]},{"title":"Representing chemical change","topic":"Physical and chemical change","desc":"Formulae first. Coefficients second.","sections":[["Equations and state symbols","A chemical equation shows reactants on the left and products on the right. The arrow means “reacts to form”. State symbols: (s) solid, (l) liquid, (g) gas and (aq) dissolved in water. Aqueous does not simply mean liquid: NaCl(aq) is salt dissolved in water, while NaCl(l) is molten salt."],["Balance the atoms","Write correct chemical formulae first. Count each element on both sides, then adjust coefficients in front of formulae to make counts equal. Reduce to the smallest whole-number ratio and check again. Never change subscripts to balance an equation: changing H₂O to H₂O₂ changes the substance. A coefficient multiplies the whole formula, so 3H₂O represents 6 H atoms and 3 O atoms."],["Worked balancing method","Start Mg + O₂ → MgO. Oxygen is two on the left but one on the right, so put 2 before MgO. Now magnesium is two on the right, so put 2 before Mg. Final: 2Mg(s) + O₂(g) → 2MgO(s). For intact polyatomic groups occurring on both sides, counting the group as a unit can simplify balancing."],["What coefficients mean","Coefficients give particle and mole ratios, not mass ratios. 2H₂ + O₂ → 2H₂O means 2 mol hydrogen molecules react with 1 mol oxygen molecules to make 2 mol water molecules. The masses are 4 g, 32 g and 36 g using school atomic masses, not 2 g, 1 g and 2 g. For gases at the same temperature and pressure, coefficients also give gas-volume ratios."]],"formula":"2Mg(s) + O₂(g) → 2MgO(s)\n2H₂(g) + O₂(g) → 2H₂O(g)\nChange COEFFICIENTS, never formula subscripts.","tip":"Keep formulae intact. The coefficient applies to every atom or ion group in that formula.","worked":"Balance Fe + O₂ → Fe₂O₃. Use 2Fe₂O₃ to give 6 O atoms, then 3O₂ and 4Fe. Final: 4Fe + 3O₂ → 2Fe₂O₃.","qs":[{"q":"Which is the correctly balanced magnesium equation?","options":["Mg + O₂ → MgO","2Mg + O₂ → 2MgO","Mg + O → MgO₂","2Mg + 2O₂ → MgO"],"answer":1,"why":"Left and right both contain 2 Mg atoms and 2 O atoms."},{"q":"In 4Fe + 3O₂ → 2Fe₂O₃, how many oxygen atoms are represented on the reactant side?","answer":6,"unit":"O atoms","why":"The coefficient 3 multiplies the O₂ formula: 3 × 2 = 6.","tolerance":0},{"q":"The symbol (aq) means…","options":["Pure liquid","Dissolved in water","Solid powder","Gas"],"answer":1,"why":"Aqueous describes a substance dissolved in water. It is not the same as the liquid state symbol (l)."},{"q":"When balancing an equation, you may change…","options":["The element symbols","The subscripts inside formulae","The coefficients before formulae","The identities of products"],"answer":2,"why":"Coefficients change amounts. Altering subscripts changes which substances are present."},{"q":"For 2H₂ + O₂ → 2H₂O, how many moles of water form from 3 mol O₂ with excess hydrogen?","answer":6,"unit":"mol","why":"O₂:H₂O = 1:2, so 3 mol O₂ gives 3 × 2 = 6 mol H₂O.","tolerance":0.03}]},{"title":"Moles, mass & particles","topic":"Quantitative aspects of chemical change","desc":"The bridge between grams and atoms.","sections":[["What is a mole?","A mole is the amount of substance containing Avogadro’s number of specified entities. Use Nₐ = 6.02 × 10²³ mol⁻¹ for school calculations unless your data sheet gives a different rounding. The modern SI value is exactly 6.02214076 × 10²³ mol⁻¹. Always specify entities: atoms, molecules, ions or formula units. A mole of water molecules and a mole of carbon atoms contain the same number of specified entities, not the same mass."],["Molar mass","Molar mass M is mass per mole, usually in g/mol. Add the relative atomic masses in the formula. H₂O: 2(1) + 16 = 18 g/mol. CO₂: 12 + 2(16) = 44 g/mol. Ca(OH)₂: 40 + 2(16 + 1) = 74 g/mol. Relative molecular/formula mass Mᵣ is a ratio with no unit; its numerical value matches M in g/mol. Relative atomic mass Aᵣ is also unitless."],["Convert mass to amount","Use n = m/M with mass in grams and molar mass in g/mol. Then m = nM. Write the formula, substitute, and attach units. Never divide mass directly by Avogadro’s constant. To move from mass to particle number, first convert mass → moles, then moles → particles."],["Count the requested particles","N = nNₐ. For 9 g H₂O: n = 9/18 = 0.5 mol molecules; N = 0.5 × 6.02 × 10²³ = 3.01 × 10²³ molecules. Each molecule has 2 H atoms, so the number of hydrogen atoms is 6.02 × 10²³. Multiply by formula subscripts only after identifying what the amount refers to."]],"formula":"n = m/M     m = nM\nN = nNₐ     n = N/Nₐ\nNₐ = 6.02 × 10²³ mol⁻¹","tip":"Mass in grams, not kilograms, when M is in g/mol. For compounds, use the whole formula to calculate M.","worked":"For 11 g CO₂: M = 44 g/mol; n = 11/44 = 0.25 mol; molecules = 0.25 × 6.02 × 10²³ = 1.505 × 10²³. Oxygen atoms = twice that number.","qs":[{"q":"Using H = 1 and O = 16, calculate the molar mass of H₂O.","answer":18,"unit":"g/mol","why":"M(H₂O) = 2(1) + 16 = 18 g/mol.","tolerance":0.09},{"q":"How many moles are in 9 g of H₂O? Use M = 18 g/mol.","answer":0.5,"unit":"mol","why":"n = m/M = 9/18 = 0.50 mol.","tolerance":0.005},{"q":"Find the mass of 0.25 mol CO₂. Use M = 44 g/mol.","answer":11,"unit":"g","why":"m = nM = 0.25 × 44 = 11 g.","tolerance":0.055},{"q":"How many molecules are in 0.5 mol H₂O? Give the coefficient in ×10²³ molecules.","answer":3.01,"unit":"×10²³ molecules","why":"N = nNₐ = 0.5 × 6.02 × 10²³ = 3.01 × 10²³ molecules.","tolerance":0.01505},{"q":"How many moles of oxygen atoms are in 2 mol CO₂ molecules?","answer":4,"unit":"mol O atoms","why":"Each CO₂ molecule contains two O atoms, so 2 mol CO₂ contains 2 × 2 = 4 mol O atoms.","tolerance":0.02}]},{"title":"Gas volumes","topic":"Quantitative aspects of chemical change","desc":"Same conditions, simple ratios.","sections":[["Avogadro’s law","Equal volumes of gases at the same temperature and pressure contain equal numbers of molecules. Gas volume is proportional to amount of substance when temperature and pressure stay fixed. This is a statement about number of particles, not equal gas masses."],["Molar gas volume","For the conventional school STP of 0 °C and approximately 101.3 kPa, use Vₘ = 22.4 dm³/mol, unless your question specifies another value or convention. Then n = V/Vₘ. This is for gases at those stated conditions; do not use 22.4 for liquids, solids, or gases at arbitrary temperatures and pressures."],["Volume units","1 dm³ = 1 L = 1000 cm³ = 1000 mL. Convert 560 cm³ to 0.560 dm³ before using a molar volume in dm³/mol. Always match the units in the numerator and denominator. 1 m³ is 1000 dm³, not 1 dm³."],["Gas-volume ratios","At the same temperature and pressure, balanced coefficients give volume ratios for gaseous substances. N₂(g) + 3H₂(g) → 2NH₃(g): 1 volume nitrogen reacts with 3 volumes hydrogen and gives 2 volumes ammonia under the same conditions. Do not apply a gas-volume ratio to liquid water. If H₂O(l) is produced, its liquid volume does not follow the gaseous coefficient rule."]],"formula":"n = V/Vₘ     V = nVₘ\nAt conventional school STP: Vₘ = 22.4 dm³/mol\n1000 cm³ = 1 dm³","tip":"STP values depend on the convention. Use the molar volume supplied in your actual examination.","worked":"11.2 dm³ O₂ at the stated STP is 11.2/22.4 = 0.5 mol. Its mass is 0.5 × 32 = 16 g. Equal volume of H₂ would have the same moles, but not the same mass.","qs":[{"q":"Convert 560 cm³ to dm³.","answer":0.56,"unit":"dm³","why":"Divide by 1000: 560/1000 = 0.560 dm³.","tolerance":0.005},{"q":"Find moles in 11.2 dm³ O₂ at STP. Use Vₘ = 22.4 dm³/mol.","answer":0.5,"unit":"mol","why":"n = V/Vₘ = 11.2/22.4 = 0.50 mol.","tolerance":0.005},{"q":"What volume does 2 mol of a gas occupy at STP with Vₘ = 22.4 dm³/mol?","answer":44.8,"unit":"dm³","why":"V = nVₘ = 2 × 22.4 = 44.8 dm³.","tolerance":0.22399999999999998},{"q":"Equal gas volumes at the same temperature and pressure have equal…","options":["Masses","Numbers of molecules","Molar masses","Atom counts in every case"],"answer":1,"why":"Avogadro’s law concerns molecular numbers. Different molecules can contain different numbers of atoms."},{"q":"N₂ + 3H₂ → 2NH₃, all gases. With excess H₂, 5 dm³ N₂ produces what NH₃ volume at the same temperature and pressure?","answer":10,"unit":"dm³","why":"Volume ratio N₂:NH₃ = 1:2. Therefore 5 × 2 = 10 dm³ NH₃.","tolerance":0.05}]},{"title":"Concentration","topic":"Quantitative aspects of chemical change","desc":"Moles per volume of solution.","sections":[["Define it precisely","Molar concentration is the amount of solute in moles per unit volume of solution. Use c = n/V with V in dm³ to obtain mol/dm³. The volume is the final solution volume, not necessarily the initial solvent volume. Concentration in g/dm³ is mass concentration and is different from molar concentration."],["From mass to concentration","If the question gives grams, first find moles with n = m/M, then use c = n/V. Example: dissolve 5.85 g NaCl and make the final solution up to 500 cm³. With M = 58.5 g/mol, n = 0.100 mol; V = 0.500 dm³; c = 0.100/0.500 = 0.200 mol/dm³."],["Rearrange for amount or volume","n = cV and V = n/c. A 0.2 mol/dm³ solution contains 0.2 mol of solute per dm³. A 250 cm³ portion is 0.25 dm³ and contains 0.2 × 0.25 = 0.05 mol. Converting the volume after substituting 250 into the formula will give a thousandfold error."],["Dilution","Adding solvent without losing solute keeps its number of moles constant while concentration decreases. Therefore c₁V₁ = c₂V₂ for a simple dilution with no reaction. Both volumes must have matching units in this ratio equation. This is a useful extension; the fundamental idea is unchanged solute amount."]],"formula":"c = n/V     n = cV\nc = m/(MV)\nV in dm³ → c in mol/dm³","tip":"Convert cm³ to dm³ BEFORE using c = n/V. Use the final solution volume.","worked":"5.85 g NaCl in 500 cm³ solution: n = 5.85/58.5 = 0.1 mol; c = 0.1/0.5 = 0.2 mol/dm³.","qs":[{"q":"Find concentration when 0.1 mol solute is present in 0.5 dm³ solution.","answer":0.2,"unit":"mol/dm³","why":"c = n/V = 0.1/0.5 = 0.20 mol/dm³.","tolerance":0.005},{"q":"Convert 250 cm³ to dm³.","answer":0.25,"unit":"dm³","why":"250/1000 = 0.250 dm³.","tolerance":0.005},{"q":"A 0.2 mol/dm³ solution has volume 250 cm³. Find moles of solute.","answer":0.05,"unit":"mol","why":"V = 0.250 dm³; n = cV = 0.2 × 0.25 = 0.050 mol.","tolerance":0.005},{"q":"5.85 g NaCl (M = 58.5 g/mol) makes 500 cm³ solution. Find concentration.","answer":0.2,"unit":"mol/dm³","why":"n = 5.85/58.5 = 0.1 mol; V = 0.5 dm³; c = 0.1/0.5 = 0.2 mol/dm³.","tolerance":0.005},{"q":"Adding only water to a solution without losing solute causes…","options":["Moles of solute to increase","Moles of solute to decrease","Concentration to decrease while solute moles stay the same","Molar mass to increase"],"answer":2,"why":"Dilution spreads the same solute amount through a larger solution volume."}]},{"title":"Composition & formulae","topic":"Quantitative aspects of chemical change","desc":"Percentages, simplest ratios, hydrates.","sections":[["Percentage composition","Mass percentage of an element = (mass of that element in one mole of compound / compound molar mass) × 100. CO₂ has M = 44 g/mol and contains 12 g carbon per mole, so %C = 12/44 × 100 = 27.27%. The oxygen contribution is 32/44 × 100 = 72.73%. Percentages should total about 100%, allowing for rounding."],["Empirical formula","An empirical formula gives the simplest whole-number ratio of atoms of each element in a compound. From percentage data, assume 100 g so each percentage becomes a gram mass. Divide each mass by its atomic molar mass to find moles, divide all by the smallest, then multiply all ratios if necessary to obtain whole numbers. A ratio 1:1.5 becomes 2:3, not 1:2."],["Molecular formula","A molecular formula gives actual atom counts in a molecule. Find its empirical-formula mass, then calculate k = molecular molar mass / empirical-formula molar mass. Multiply every empirical subscript by the whole-number k. For empirical CH₂O with mass 30 g/mol and molecular molar mass 180 g/mol, k = 6 and the molecular formula is C₆H₁₂O₆."],["Water of crystallisation","Water of crystallisation is water incorporated in a definite ratio in a crystalline salt. CuSO₄·5H₂O contains five water molecules per CuSO₄ formula unit. Under suitable conditions, heating removes this water. Find water mass lost = hydrated salt mass − anhydrous salt mass. Convert both water mass and anhydrous salt mass to moles, then divide n(water) by n(salt) to find x in salt·xH₂O. Do not use their mass ratio as x."]],"formula":"% element = (element mass contribution / Mcompound) × 100\nEmpirical: mass → moles → divide by smallest → whole numbers\nHydrate x = n(H₂O)/n(anhydrous salt)","tip":"Formula ratios come from MOLES, not masses. Keep sufficient digits before rounding ratios.","worked":"40.0% C, 6.7% H, 53.3% O: in 100 g, moles ≈ 3.333, 6.7, 3.331. Divide by 3.331 → 1:2:1, so empirical formula CH₂O. For a hydrate, 2.50 g CuSO₄·xH₂O leaves 1.60 g CuSO₄ (M = 160): water = 0.90/18 = 0.050 mol; salt = 1.60/160 = 0.010 mol; x = 5.","qs":[{"q":"Find carbon mass percentage in CO₂. Use C = 12 and O = 16.","answer":27.272727,"unit":"%","why":"%C = 12/(12 + 2×16) × 100 = 27.27%.","tolerance":0.136363635},{"q":"A compound contains C:H:O in a mole ratio 1:2:1. Its empirical formula is…","options":["C₂HO","CH₂O","CHO₂","C₁₂H₂O"],"answer":1,"why":"The empirical formula uses the simplest whole-number atom ratio."},{"q":"An empirical formula has molar mass 30 g/mol and the molecular molar mass is 180 g/mol. What multiplier is needed?","answer":6,"unit":"multiplier","why":"k = 180/30 = 6. Multiply every empirical subscript by six.","tolerance":0},{"q":"A mole ratio is 1:1.5. The simplest whole-number ratio is…","options":["1:2","2:3","1:1","3:2"],"answer":1,"why":"Multiply both terms by 2 to remove the fraction: 2:3."},{"q":"A hydrate gives 0.050 mol water and 0.010 mol anhydrous salt. Find x in salt·xH₂O.","answer":5,"unit":"waters per formula unit","why":"x = n(water)/n(salt) = 0.050/0.010 = 5.","tolerance":0}]},{"title":"Stoichiometry & yield","topic":"Quantitative aspects of chemical change","desc":"Let the balanced equation lead.","sections":[["The calculation route","Stoichiometry uses a balanced equation to relate reacting amounts. Step 1: balance. Step 2: convert the known mass, volume or concentration into moles. Step 3: use the coefficient mole ratio. Step 4: convert the required amount into the requested mass, volume, concentration or number of particles. Coefficients do not give gram ratios."],["Worked mass calculation","2Mg + O₂ → 2MgO. React 4.8 g Mg with excess oxygen; use Mg = 24 and O = 16. n(Mg) = 4.8/24 = 0.20 mol. The Mg:MgO ratio is 2:2, or 1:1. n(MgO) = 0.20 mol. M(MgO) = 40 g/mol, so m(MgO) = 0.20 × 40 = 8.0 g. The extra mass comes from oxygen, so no conservation law is violated."],["Theoretical and percentage yield","Theoretical yield is the maximum product predicted from the given reacting amount under the stated assumptions. Actual yield is the amount obtained experimentally. Percentage yield = actual/theoretical × 100. If the theoretical yield is 8.0 g and actual yield is 6.4 g, yield = 80%. A low yield can reflect incomplete reaction, side reactions or product loss. A measured value above 100% suggests issues such as wet/impure product or measurement error."],["If two reacting amounts are given","Do not assume both react completely. As an optional extension, compare n/coefficient for each reactant: the smaller value identifies the limiting reactant. It fixes the theoretical product amount. If a question states another reactant is in excess, base your calculation on the specified reacting amount. Keep the basic mass → moles → ratio → required quantity method as your first priority."]],"formula":"Known quantity → moles → coefficient ratio → required quantity\n% yield = actual yield / theoretical yield × 100","tip":"Balance first. Never use coefficient ratios directly as mass ratios. “Excess oxygen” means oxygen does not limit the stated reaction.","worked":"CaCO₃ → CaO + CO₂. For 10 g CaCO₃ (M = 100), n = 0.10 mol. CO₂ forms in a 1:1 ratio, so n(CO₂) = 0.10 mol. At the stated STP: V = 0.10 × 22.4 = 2.24 dm³. Its mass is 0.10 × 44 = 4.4 g.","qs":[{"q":"2Mg + O₂ → 2MgO. How many moles are in 4.8 g Mg? Use M = 24 g/mol.","answer":0.2,"unit":"mol","why":"n(Mg) = m/M = 4.8/24 = 0.20 mol.","tolerance":0.005},{"q":"The same equation: 0.2 mol Mg reacts with excess O₂. Find mass of MgO; M(MgO) = 40 g/mol.","answer":8,"unit":"g","why":"Mg:MgO = 2:2 = 1:1, so n(MgO) = 0.20 mol. m = nM = 0.20 × 40 = 8.0 g.","tolerance":0.04},{"q":"Theoretical product mass is 8 g; actual mass is 6.4 g. Find percentage yield.","answer":80,"unit":"%","why":"Yield = actual/theoretical × 100 = 6.4/8 × 100 = 80%.","tolerance":0.4},{"q":"CaCO₃ → CaO + CO₂. 0.1 mol CaCO₃ decomposes fully. Find CO₂ volume at STP; Vₘ = 22.4 dm³/mol.","answer":2.24,"unit":"dm³","why":"The mole ratio is 1:1. n(CO₂) = 0.10 mol; V = 0.10 × 22.4 = 2.24 dm³.","tolerance":0.011200000000000002},{"q":"The first step in a reaction-quantity calculation should be…","options":["Use coefficients as gram ratios","Write and balance the correct equation","Multiply every mass by Avogadro’s number","Change formula subscripts"],"answer":1,"why":"Balanced coefficients provide the correct mole ratios for the calculation."}]}],"glossary":[["Pure substance","A substance with a fixed chemical composition and characteristic properties."],["Element","A pure substance containing one kind of atom."],["Compound","A pure substance containing two or more different elements chemically bonded in fixed proportions."],["Mixture","Two or more substances physically combined, retaining their chemical identities and separable by physical methods."],["Homogeneous mixture","A mixture with uniform composition throughout at the scale considered."],["Heterogeneous mixture","A mixture with non-uniform composition."],["Diffusion","Net spreading of particles from higher to lower concentration as a result of random motion."],["Atomic number","The number of protons in an atom’s nucleus."],["Mass number","The total number of protons and neutrons in an atom’s nucleus."],["Isotopes","Atoms of the same element with the same proton number but different neutron numbers."],["Orbital","A region of space where there is a high probability of finding an electron."],["Ion","An atom or bonded group of atoms with a net electric charge due to electron loss or gain."],["Cation / anion","A positively charged ion / a negatively charged ion."],["Ionic bond","Electrostatic attraction between oppositely charged ions."],["Covalent bond","A bond involving a shared pair of electrons attracted to both bonded atomic nuclei."],["Metallic bond","Electrostatic attraction between positive metal ion cores and delocalised electrons."],["Molecule","A discrete group of atoms held together by covalent bonds."],["Formula unit","The simplest whole-number ratio of ions in an ionic compound."],["Physical change","A change in which the chemical identities of the substances do not change."],["Chemical change","A change that forms one or more new chemical substances."],["Conservation of mass","Total mass remains constant during a reaction in a closed system."],["Constant composition","A given pure compound always contains the same elements in fixed proportions by mass."],["Mole","The amount of substance containing Avogadro’s number of specified entities."],["Molar mass","Mass per mole of a substance; commonly measured in g/mol."],["Relative atomic mass","Weighted mean atomic mass of an element relative to one twelfth of the mass of a carbon-12 atom; no unit."],["Molar concentration","Amount of solute in moles per unit volume of solution."],["Avogadro’s law","Equal volumes of gases at the same temperature and pressure contain equal numbers of molecules."],["Empirical formula","The simplest whole-number ratio of atoms of each element in a compound."],["Molecular formula","The actual number of atoms of each element in a molecule."],["Water of crystallisation","Water incorporated in a definite ratio in the crystal structure of a salt."]],"elements":[["H","Hydrogen",1,1,1,1,"1"],["He","Helium",2,4,18,1,"2"],["Li","Lithium",3,7,1,2,"2,1"],["Be","Beryllium",4,9,2,2,"2,2"],["B","Boron",5,11,13,2,"2,3"],["C","Carbon",6,12,14,2,"2,4"],["N","Nitrogen",7,14,15,2,"2,5"],["O","Oxygen",8,16,16,2,"2,6"],["F","Fluorine",9,19,17,2,"2,7"],["Ne","Neon",10,20,18,2,"2,8"],["Na","Sodium",11,23,1,3,"2,8,1"],["Mg","Magnesium",12,24,2,3,"2,8,2"],["Al","Aluminium",13,27,13,3,"2,8,3"],["Si","Silicon",14,28,14,3,"2,8,4"],["P","Phosphorus",15,31,15,3,"2,8,5"],["S","Sulfur",16,32,16,3,"2,8,6"],["Cl","Chlorine",17,35.5,17,3,"2,8,7"],["Ar","Argon",18,40,18,3,"2,8,8"],["K","Potassium",19,39,1,4,"2,8,8,1"],["Ca","Calcium",20,40,2,4,"2,8,8,2"]],"exam":[{"title":"1 · Multiple choice","marks":10,"intro":"Choose one correct option for each. Each question is worth one mark.","items":[{"q":"Which is a homogeneous mixture?","options":["Distilled water","Air","Copper","Sand and water"],"answer":1,"why":"Air is a uniform mixture of gases, not a pure substance.","id":"1.1","marks":1,"type":"mc"},{"q":"During a melting plateau at constant pressure, a pure substance’s…","options":["Average kinetic energy steadily increases","Temperature stays constant while energy is absorbed","Particles become larger atoms","Atoms turn into new elements"],"answer":1,"why":"Energy changes particle arrangement/potential energy; average kinetic energy stays constant.","id":"1.2","marks":1,"type":"mc"},{"q":"Isotopes have the same…","options":["Mass number","Neutron number","Proton number","Physical mass in every case"],"answer":2,"why":"Same element means same proton number; isotopes differ in neutron number.","id":"1.3","marks":1,"type":"mc"},{"q":"An atom with shell arrangement 2,8,2 belongs to…","options":["Period 2, group 3","Period 3, group 2","Period 3, group 12","Period 2, group 18"],"answer":1,"why":"Three occupied energy levels and two valence electrons identify period 3 and group 2.","id":"1.4","marks":1,"type":"mc"},{"q":"The bond between Na⁺ and Cl⁻ is…","options":["Metallic","Ionic","A shared proton","Intermolecular only"],"answer":1,"why":"Oppositely charged ions attract electrostatically.","id":"1.5","marks":1,"type":"mc"},{"q":"How many shared pairs occur in an O₂ double bond?","options":["1","2","3","4"],"answer":1,"why":"A double bond shares two electron pairs.","id":"1.6","marks":1,"type":"mc"},{"q":"Which is a chemical change?","options":["Melting wax without burning","Evaporating water","Burning magnesium","Crushing ice"],"answer":2,"why":"Burning magnesium produces a new substance, magnesium oxide.","id":"1.7","marks":1,"type":"mc"},{"q":"The formula Al₂O₃ shows an Al:O atom ratio of…","options":["3:2","2:3","1:1","2:1"],"answer":1,"why":"Subscripts give the atom ratio in the formula.","id":"1.8","marks":1,"type":"mc"},{"q":"One mole of H₂O contains approximately…","options":["6.02 × 10²³ water molecules","18 water molecules","6.02 × 10²³ total atoms","One hydrogen atom"],"answer":0,"why":"One mole has Avogadro’s number of specified entities. Each water molecule has three atoms.","id":"1.9","marks":1,"type":"mc"},{"q":"The unit mol/dm³ measures…","options":["Molar mass","Relative atomic mass","Molar concentration","Density in g/cm³"],"answer":2,"why":"Molar concentration is moles of solute per dm³ of solution.","id":"1.10","marks":1,"type":"mc"}]},{"title":"2 · Matter and classification","marks":10,"intro":"Consider copper, oxygen gas (O₂), distilled water, salt solution and sand mixed with water.","items":[{"id":"2.1","q":"Define a compound.","marks":2,"answer":"A pure substance made of two or more different elements chemically bonded in fixed proportions.","steps":["Two or more different elements chemically bonded (1).","Fixed composition/proportion in a pure substance (1)."],"type":"written"},{"id":"2.2","q":"Classify each of the five samples as an element, compound, homogeneous mixture or heterogeneous mixture.","marks":5,"answer":"Copper: element. O₂: element. Distilled water: compound. Salt solution: homogeneous mixture. Sand and water: heterogeneous mixture.","steps":["One mark for each correct classification (5)."],"type":"written"},{"id":"2.3","q":"Choose and explain a method to collect pure water from salt solution.","marks":3,"answer":"Distillation. Vaporise the water by heating, then cool and condense the vapour into a separate container; non-volatile salt remains behind.","steps":["Distillation (1).","Water vaporises and is then condensed (1).","Condensed water collected separately / salt left behind (1)."],"type":"written"}]},{"title":"3 · States and kinetic molecular theory","marks":10,"intro":"A pure substance at constant pressure has these heating-curve points, joined by straight lines: (0 min, −20 °C), (2 min, 0 °C), (5 min, 0 °C), (9 min, 80 °C), (13 min, 80 °C), (15 min, 120 °C). Energy is supplied continuously at a constant rate.","items":[{"id":"3.1","q":"State the melting point.","marks":1,"answer":0,"unit":"°C","steps":["First plateau: solid changes to liquid at 0 °C (1)."],"type":"number","tolerance":0},{"id":"3.2","q":"State the boiling point.","marks":1,"answer":80,"unit":"°C","steps":["Second plateau: liquid changes to gas at 80 °C (1)."],"type":"number","tolerance":0},{"id":"3.3","q":"Explain why temperature remains constant from 2 to 5 minutes even though energy is supplied.","marks":3,"answer":"The substance is melting. Supplied energy overcomes attractions/increases potential energy rather than increasing average kinetic energy, so temperature stays constant.","steps":["Melting occurs (1).","Energy overcomes attractions / increases potential energy (1).","Average kinetic energy does not increase, so temperature is constant (1)."],"type":"written"},{"id":"3.4","q":"Compare particle arrangement and motion in a solid and in a gas.","marks":4,"answer":"Solid: particles closely packed, vibrating around fixed positions. Gas: particles far apart, moving freely and randomly.","steps":["Solid arrangement: closely packed (1).","Solid motion: vibration about fixed positions (1).","Gas arrangement: far apart (1).","Gas motion: free/random motion (1)."],"type":"written"},{"id":"3.5","q":"Name the direct change from gas to solid.","marks":1,"answer":"Deposition.","steps":["Deposition (1)."],"type":"written"}]},{"title":"4 · Atoms and the periodic table","marks":15,"intro":"Use the ion ²⁷₁₃Al³⁺. For the isotope average, use the given mass numbers as approximate isotope masses.","items":[{"id":"4.1","q":"State the number of protons, neutrons and electrons in ²⁷₁₃Al³⁺.","marks":3,"answer":"13 protons; 27 − 13 = 14 neutrons; 13 − 3 = 10 electrons.","steps":["13 protons (1).","14 neutrons (1).","10 electrons (1)."],"type":"written"},{"id":"4.2","q":"Define isotopes.","marks":2,"answer":"Atoms of the same element with the same proton number but different neutron numbers.","steps":["Same proton number / same element (1).","Different neutron numbers (1)."],"type":"written"},{"id":"4.3","q":"A sample contains 75% isotope-35 and 25% isotope-37. Calculate approximate relative atomic mass.","marks":3,"answer":35.5,"unit":"no unit","steps":["Use fractional abundances 0.75 and 0.25 (1).","Aᵣ ≈ 0.75(35) + 0.25(37) (1).","35.5, without a unit (1)."],"type":"number","tolerance":0.1775},{"id":"4.4","q":"Write the ground-state sp electron configuration of a neutral aluminium atom (Z = 13).","marks":3,"answer":"1s² 2s² 2p⁶ 3s² 3p¹.","steps":["Correct filling order and subshell labels (1).","1s² 2s² 2p⁶ core (1).","3s² 3p¹ outer electrons; total 13 (1)."],"type":"written"},{"id":"4.5","q":"Give neutral aluminium’s period and group using modern 1–18 group numbering.","marks":2,"answer":"Period 3; group 13.","steps":["Period 3 (1).","Group 13 (1)."],"type":"written"},{"id":"4.6","q":"Explain why atomic radius generally increases down a group.","marks":2,"answer":"Additional occupied energy levels are added, placing the outer electrons farther from the nucleus.","steps":["More occupied energy levels/shells (1).","Outer electrons farther from the nucleus / larger atom (1)."],"type":"written"}]},{"title":"5 · Bonding and particles","marks":15,"intro":"Use simple Lewis electron-dot models. Draw diagrams on paper, then describe what you drew in the answer field if you wish.","items":[{"id":"5.1","q":"Define ionic bonding.","marks":2,"answer":"Electrostatic attraction between oppositely charged ions.","steps":["Electrostatic attraction (1).","Between oppositely charged ions (1)."],"type":"written"},{"id":"5.2","q":"Write the neutral formula formed by Mg²⁺ and Cl⁻. Explain the ion ratio.","marks":3,"answer":"MgCl₂. One Mg²⁺ combines with two Cl⁻ so that +2 + 2(−1) = 0.","steps":["MgCl₂ (1).","One magnesium ion to two chloride ions (1).","Total charge balances to zero (1)."],"type":"written"},{"id":"5.3","q":"Draw a Lewis diagram of H₂O showing all valence electrons.","marks":4,"answer":"H–O–H with one shared pair in each O–H bond and two lone pairs on oxygen. Eight valence electrons in total.","steps":["O as central atom with two terminal H atoms (1).","One shared pair per O–H bond (1).","Two lone pairs on O (1).","Eight valence electrons total; H duets and O octet (1)."],"type":"written"},{"id":"5.4","q":"Explain why solid NaCl does not conduct, but molten NaCl does.","marks":3,"answer":"NaCl contains ions. In the solid the ions are fixed in a lattice and cannot carry charge through it; in the melt they can move and carry current.","steps":["Charge carriers are ions (1).","Solid ions fixed / not free to move (1).","Molten ions mobile and carry charge (1)."],"type":"written"},{"id":"5.5","q":"Classify each structure: diamond, oxygen gas and copper metal.","marks":3,"answer":"Diamond: giant covalent network. Oxygen: separate O₂ molecules. Copper: metallic structure with delocalised electrons.","steps":["Diamond: giant covalent network (1).","Oxygen gas: molecules (1).","Copper: metallic structure (1)."],"type":"written"}]},{"title":"6 · Physical and chemical change","marks":10,"intro":"Hydrogen reacts with oxygen to form water.","items":[{"id":"6.1","q":"Distinguish a physical change from a chemical change.","marks":2,"answer":"Physical change leaves chemical identities unchanged; chemical change produces new chemical substances.","steps":["No new substances in physical change (1).","New substances in chemical change (1)."],"type":"written"},{"id":"6.2","q":"Balance: H₂(g) + O₂(g) → H₂O(l). Use the smallest whole-number coefficients.","marks":3,"answer":"2H₂(g) + O₂(g) → 2H₂O(l).","steps":["Correct hydrogen coefficient 2 (1).","Correct oxygen coefficient 1, written or implied (1).","Correct water coefficient 2; formulae unchanged (1)."],"type":"written"},{"id":"6.3","q":"State the law of conservation of mass for a chemical reaction.","marks":2,"answer":"Total mass remains constant in a closed system: total reactant mass equals total product mass.","steps":["Total mass is conserved / reactant mass equals product mass (1).","Closed-system condition (1)."],"type":"written"},{"id":"6.4","q":"Explain why 2H₂ + O₂ → 2H₂O conserves atoms but does not conserve the number of molecules.","marks":3,"answer":"There are four H atoms and two O atoms on each side. There are three reactant molecules represented and two product molecules, so molecule number changes.","steps":["Four H atoms on both sides (1).","Two O atoms on both sides (1).","Three molecules become two / molecule number need not be conserved (1)."],"type":"written"}]},{"title":"7 · Quantitative aspects of chemical change","marks":30,"intro":"Use H = 1, C = 12, O = 16, Na = 23, Mg = 24 and Cl = 35.5. Nₐ = 6.02 × 10²³ mol⁻¹. At the stated STP (0 °C, 101.3 kPa), Vₘ = 22.4 dm³/mol. Show working on paper to check against the memo.","items":[{"id":"7.1","q":"Calculate the molar mass of CO₂.","marks":2,"answer":44,"unit":"g/mol","steps":["M = 12 + 2(16) (1).","44 g/mol (1)."],"type":"number","tolerance":0.22},{"id":"7.2","q":"Calculate the amount of CO₂ in 11 g, using M = 44 g/mol.","marks":3,"answer":0.25,"unit":"mol","steps":["n = m/M (1).","11/44 (1).","0.25 mol (1)."],"type":"number","tolerance":0.005},{"id":"7.3","q":"How many CO₂ molecules are in 0.25 mol? Enter the coefficient in ×10²³ molecules.","marks":3,"answer":1.505,"unit":"×10²³ molecules","steps":["N = nNₐ (1).","0.25 × 6.02 × 10²³ (1).","1.505 × 10²³ molecules (1)."],"type":"number","tolerance":0.007525},{"id":"7.4","q":"Calculate the volume of 0.25 mol CO₂ at the stated STP.","marks":3,"answer":5.6,"unit":"dm³","steps":["V = nVₘ (1).","0.25 × 22.4 (1).","5.60 dm³ (1)."],"type":"number","tolerance":0.027999999999999997},{"id":"7.5","q":"5.85 g NaCl is made up to 250 cm³ of solution. Calculate concentration. M(NaCl) = 58.5 g/mol.","marks":4,"answer":0.4,"unit":"mol/dm³","steps":["n = 5.85/58.5 = 0.100 mol (1).","V = 250/1000 = 0.250 dm³ (1).","c = n/V = 0.100/0.250 (1).","0.400 mol/dm³ (1)."],"type":"number","tolerance":0.005},{"id":"7.6","q":"Calculate oxygen’s mass percentage in H₂O. M(H₂O) = 18 g/mol.","marks":3,"answer":88.888889,"unit":"%","steps":["Element mass contribution / compound molar mass × 100 (1).","16/18 × 100 (1).","88.89% (1)."],"type":"number","tolerance":0.444444445},{"id":"7.7","q":"Find the empirical formula of a compound containing 40.0% C, 6.7% H and 53.3% O. Show the method.","marks":4,"answer":"Assume 100 g. Moles: C = 40/12 = 3.333; H = 6.7/1 = 6.7; O = 53.3/16 = 3.331. Divide by smallest to get about 1:2:1. Empirical formula CH₂O.","steps":["Assume 100 g / interpret percentages as masses (1).","Convert each element mass to moles (1).","Divide all by the smallest to get 1:2:1 (1).","CH₂O (1)."],"type":"written"},{"id":"7.8","q":"2Mg + O₂ → 2MgO. Calculate MgO mass from 4.8 g Mg with excess O₂. M(Mg) = 24 and M(MgO) = 40 g/mol.","marks":5,"answer":8,"unit":"g","steps":["n(Mg) = m/M (1).","n(Mg) = 4.8/24 = 0.20 mol (1).","Use Mg:MgO coefficient ratio 2:2 = 1:1, so n(MgO) = 0.20 mol (1).","m(MgO) = nM = 0.20 × 40 (1).","8.0 g (1)."],"type":"number","tolerance":0.04},{"id":"7.9","q":"Actual MgO mass is 6.4 g; theoretical mass is 8.0 g. Calculate percentage yield.","marks":3,"answer":80,"unit":"%","steps":["% yield = actual/theoretical × 100 (1).","6.4/8.0 × 100 (1).","80% (1)."],"type":"number","tolerance":0.4}]}]};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function parseAnswer(raw){const s=String(raw).trim().replace(/−/g,'-').replace(/,/g,'.');if(!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(s))return NaN;return Number(s)}
