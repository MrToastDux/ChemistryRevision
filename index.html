function home(){stage='home';session=null;header();const done=Object.values(saved.best).filter(v=>v===5).length;const next=lessons.findIndex((_,i)=>saved.best[i]!==5);app.innerHTML=nav('home')+`<section class="hero"><div><div class="eyebrow">South Africa · Grade 10 · Paper 2</div><h1>A little chemistry.<br>A lot more confidence.</h1><p class="muted">Short lessons, small wins and worked answers. Build your way from matter and atoms to moles and reaction calculations.</p><div class="actions"><button class="btn" onclick="startLesson(${next<0?0:next})">${done?'Keep learning':'Start learning'} →</button><button class="btn secondary" onclick="showGuide()">Read the guide</button></div></div><div class="heroart" aria-hidden="true"><svg viewBox="0 0 330 230"><circle cx="168" cy="106" r="81" fill="#e3d8ff"/><path d="M137 39h61M146 39v60l-47 73q-12 19 10 19h119q22 0 10-19l-47-73V39" fill="#fff" stroke="#694da5" stroke-width="3"/><path d="M124 139h87l23 38q5 8-6 8H111q-11 0-6-8Z" fill="#baa3ed"/><circle cx="157" cy="155" r="7" fill="#fff"/><circle cx="189" cy="172" r="5" fill="#fff"/><circle cx="179" cy="119" r="5" fill="#a589db"/><circle cx="157" cy="89" r="4" fill="#a589db"/><path d="M65 72h18M74 63v18M252 112h18M261 103v18" stroke="#694da5" stroke-width="2"/></svg><span class="artlabel">MASS → MOLES → RATIO → ANSWER.</span></div></section><div class="sectionbar"><h2>Your learning path</h2><div class="overall"><div class="progress"><span style="width:${done/lessons.length*100}%"></span></div><p>${done} / ${lessons.length} lessons mastered</p></div></div><div class="grid">${lessons.map((l,i)=>`<button class="lesson ${saved.best[i]===5?'done':''}" onclick="startLesson(${i})"><span class="num">${String(i+1).padStart(2,'0')}</span>${saved.best[i]===5?'<span class="tick">✓</span>':''}<h3>${esc(l.title)}</h3><span class="meta">${saved.best[i]!==undefined?'Best '+saved.best[i]+'/5 · ':''}5 questions · ~4 min</span></button>`).join('')}</div><div class="sectionbar"><h2>Put it into practice</h2></div><div class="practice"><div><h3>Mix it up</h3><p class="muted">20 quick questions with at least one from every lesson. Instant explanations after every answer.</p><button class="btn secondary small" onclick="startMixed()">Mixed practice →</button></div><div><h3>Learn from your mistakes</h3><p class="muted">${saved.mistakes.length?`${saved.mistakes.length} question${saved.mistakes.length===1?'':'s'} ready to revisit.`:'Missed questions appear here. No waiting to refill hearts and no locked lessons.'}</p><button class="btn secondary small" ${saved.mistakes.length?'':'disabled'} onclick="startReview()">Review mistakes →</button></div><div><h3>A proper practice paper</h3><p class="muted">100 marks: 10 multiple-choice marks, definitions, explanations, diagrams and calculations. Includes a worked memo.</p><button class="btn secondary small" onclick="showExam()">Open mock exam →</button></div><div><h3>Last-minute essentials</h3><p class="muted">Definitions, common ions, the first 20 elements and the formulae you will use most.</p><button class="btn secondary small" onclick="showReference()">Quick reference →</button></div></div><p class="bottomnote">Progress saves in this browser, separately from Physics. <button class="plain" style="font-size:12px" onclick="resetProgress()">Reset chemistry progress</button></p>`;moveTop()}
function lessonBody(l){return l.sections.map(([h,t])=>`<h3>${esc(h)}</h3><p>${esc(t)}</p>`).join('')+`<div class="formula">${nl(l.formula)}</div>${l.diagram?diagram(l.diagram):''}<div class="worked"><b>Worked example</b><p>${esc(l.worked)}</p></div><p class="note">Exam reminder: ${esc(l.tip)}</p>`}
function startLesson(i){const l=lessons[i];session={type:'lesson',lesson:i,title:l.title,qs:prepare(l.qs),at:0,correct:0,hearts:5,answers:[],xp:0};stage='intro';header();app.innerHTML=`<div class="study"><div class="crumb"><button class="plain" onclick="home()">← Learning path</button><span class="tag">LESSON ${i+1} OF ${lessons.length}</span></div><div class="eyebrow">${esc(l.topic)}</div><h1 style="font-size:38px">${esc(l.title)}</h1><div class="panel reading">${lessonBody(l)}</div><div class="footerrow"><span class="tag">5 questions · +10 XP per new correct answer</span><button class="btn" onclick="showQuestion()">Let's practise →</button></div></div>`;moveTop()}
function prepare(qs){return qs.map(q=>({...q,order:q.options?shuffle(q.options.map((_,i)=>i)):null}))}
function startSession(type,title,qs){session={type,title,qs:prepare(qs),at:0,correct:0,hearts:5,answers:[],xp:0};showQuestion()}
function startMixed(){const sampled=lessons.map(l=>shuffle(l.qs)[0]);const ids=new Set(sampled.map(q=>q.id));sampled.push(...shuffle(bank.filter(q=>!ids.has(q.id))).slice(0,20-sampled.length));startSession('mixed','Mixed practice',shuffle(sampled))}
function startReview(){const qs=bank.filter(q=>saved.mistakes.includes(q.id));if(qs.length)startSession('review','Mistake practice',shuffle(qs));else home()}
function showQuestion(){stage='question';selection=null;answered=false;const q=session.qs[session.at];header();app.innerHTML=`<div class="study"><div class="crumb"><button class="plain" onclick="home()">← Learning path</button><span class="tag">${session.at+1} / ${session.qs.length}</span></div><div class="progress"><span style="width:${session.at/session.qs.length*100}%"></span></div><div class="panel"><div class="eyebrow">${esc(lessons[q.lesson].title)} · ${q.options?'Choose one':'Calculate it'}</div><h2 class="question">${esc(q.q)}</h2>${q.options?`<div class="choices">${q.order.map((oi,i)=>`<button class="choice" id="choice${oi}" aria-pressed="false" onclick="selectAnswer(${oi})"><span class="letter">${'ABCD'[i]}</span><span>${esc(q.options[oi])}</span></button>`).join('')}</div>`:`<label class="sr" for="number">Your numerical answer</label><div class="numberrow"><input type="text" inputmode="decimal" id="number" placeholder="Your answer" autocomplete="off" oninput="document.querySelector('#check').disabled=!this.value.trim()"><span class="unit">${esc(q.unit)}</span></div><p class="tag">Enter only the number; use the unit shown. Decimal commas and points both work.</p>`}<div id="feedback" aria-live="polite"></div><div class="footerrow"><button class="plain" onclick="toggleHint()" id="hintbtn">Need a reminder?</button><button class="btn" id="check" disabled onclick="checkAnswer()">Check answer</button></div><div id="hint"></div></div></div>`;moveTop()}
function selectAnswer(i){if(answered)return;selection=i;document.querySelectorAll('.choice').forEach(b=>{const selected=b.id==='choice'+i;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});document.querySelector('#check').disabled=false}
function toggleHint(){const h=document.querySelector('#hint'),l=lessons[session.qs[session.at].lesson];h.innerHTML=h.innerHTML?'':`<div class="formula">${nl(l.formula)}</div><p class="note">${esc(l.tip)}</p>`}
function checkAnswer(){if(answered)return;const q=session.qs[session.at];const value=q.options?selection:parseAnswer(document.querySelector('#number').value);if(q.options&&value===null)return;if(!q.options&&!Number.isFinite(value)){document.querySelector('#feedback').innerHTML='<p role="alert">Enter a valid number, such as 0.5 or 3.01.</p>';return}answered=true;good=q.options?value===q.answer:Math.abs(value-q.answer)<=q.tolerance;session.answers.push({q,value,good});if(good){session.correct++;saved.mistakes=saved.mistakes.filter(id=>id!==q.id);if(!saved.earned.includes(q.id)){saved.earned.push(q.id);saved.xp+=10;session.xp+=10}}else{session.hearts--;if(!saved.mistakes.includes(q.id))saved.mistakes.push(q.id)}persist();header();if(q.options){document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;b.classList.remove('selected');if(b.id==='choice'+q.answer)b.classList.add('correct');else if(b.id==='choice'+value)b.classList.add('wrong')})}else document.querySelector('#number').disabled=true;document.querySelector('#feedback').innerHTML=`<div class="feedback ${good?'':'bad'}"><strong>${good?'✓ Nice work!':'Let’s work through it.'}</strong>${!good?`<p>Correct answer: <b>${q.options?esc(q.options[q.answer]):esc(formatAnswer(q))}</b></p>`:''}<p>${esc(q.why)}</p>${session.hearts===0?'<p><b>Read the explanation, then refill and carry on. Learning stays open.</b></p>':''}</div>`;const b=document.querySelector('#check');b.disabled=false;b.textContent=session.at===session.qs.length-1?'See results →':session.hearts===0?'Refill hearts & continue →':'Continue →';b.onclick=nextQuestion;document.querySelector('#hintbtn').hidden=true}
function formatAnswer(q){return Number.isInteger(q.answer)?q.answer+' '+q.unit:parseFloat(q.answer.toFixed(4))+' '+q.unit}

function showGuide(){page('Your Chemistry revision guide','Learn it, then practise it','guide',`<div class="panel"><h2>How to use this</h2><p>Cover the worked example and try it on paper before reading the method. After each topic, practise its five questions. Before the mock paper, make sure you can define the bold ideas, balance an equation and move between mass, moles, particles and volume.</p><p class="note">This guide follows the eight topics you supplied. Your teacher’s scope and data sheet take priority. Reactions in aqueous solution and chemical systems are not added as separate topics. Limiting-reactant and dilution methods are labelled as extensions.</p><div class="guideindex">${lessons.map((l,i)=>`<a href="#guide-${i}">${i+1}. ${esc(l.title)}</a>`).join('')}</div></div>${lessons.map((l,i)=>`<article class="panel" id="guide-${i}"><div class="eyebrow">${esc(l.topic)}</div><h2>${i+1}. ${esc(l.title)}</h2>${lessonBody(l)}<button class="btn secondary small noprint" onclick="startLesson(${i})">Practise this lesson →</button></article>`).join('')}<div class="panel"><h2>Exam technique</h2><ol><li>Identify the particles and quantities requested. Atoms and molecules are different counts.</li><li>Write the correct formula or balanced equation before substituting numbers.</li><li>Convert cm³ to dm³ for concentration and molar-gas-volume calculations.</li><li>For stoichiometry: convert to moles, apply the coefficient ratio, then convert to the requested quantity.</li><li>Keep formula subscripts unchanged when balancing; change coefficients only.</li><li>Give units. Relative atomic/molecular/formula masses have no unit; molar mass has g/mol.</li><li>Keep working visible: it can earn method marks.</li></ol></div>${sourceBox()}`)}
function sourceBox(){return `<div class="panel sources"><h3>Scope and sources</h3><p>Original teaching explanations, practice questions and mock paper, checked against DBE Grade 10 topic guidance. The practice paper is not an official exam, and its timing and mark distribution are chosen for revision.</p><a href="https://www.education.gov.za/Portals/0/Documents/Recovery%20plan%20page/2023%20ATPs/FET%20Content%20Subjects/Grade%2010/1.520%20ATP%202023-24%20Gr%2010%20Phys%20Sci%20final.pdf" target="_blank" rel="noopener">DBE Grade 10 annual teaching plan</a><br><a href="https://www.education.gov.za/Portals/0/CD/National%20Curriculum%20Statements%20and%20Vocational/CAPS%20FET%20%20PHYSICAL%20SCIENCE%20WEB.pdf" target="_blank" rel="noopener">DBE CAPS Physical Sciences</a></div>`}
function showReference(){page('The essentials, in one place','Definitions · formulae · ions','reference',`<div class="panel"><h2>Calculation map</h2><div class="formula">n = m/M &nbsp; · &nbsp; N = nNₐ &nbsp; · &nbsp; n = V/Vₘ &nbsp; · &nbsp; c = n/V<br>% yield = actual/theoretical × 100<br>Stoichiometry: known quantity → moles → ratio → required quantity</div><p>Nₐ = 6.02 × 10²³ mol⁻¹ for these exercises. At conventional school STP (0 °C, 101.3 kPa), Vₘ = 22.4 dm³/mol. Use your exam’s given constants.</p><p><b>Conversions:</b> 1000 cm³ = 1 dm³ = 1 L. &nbsp; 1000 g = 1 kg. &nbsp; With M in g/mol, mass must be in grams.</p></div><div class="panel"><h2>Common ions</h2><div class="tablewrap"><table><thead><tr><th>Cations</th><th>Anions</th></tr></thead><tbody><tr><td>Na⁺, K⁺, Ag⁺, NH₄⁺</td><td>Cl⁻, Br⁻, I⁻, OH⁻, NO₃⁻</td></tr><tr><td>Mg²⁺, Ca²⁺, Ba²⁺, Zn²⁺</td><td>O²⁻, S²⁻, SO₄²⁻, CO₃²⁻</td></tr><tr><td>Al³⁺</td><td>N³⁻</td></tr></tbody></table></div><p class="note">Some metals form more than one ion, such as Fe²⁺/Fe³⁺ and Cu⁺/Cu²⁺. Use the stated name or ion table: iron(III) means Fe³⁺.</p></div><div class="panel"><h2>First 20 elements</h2><p class="muted">A compact reference, not a full periodic table. Masses here are rounded school values; use your paper’s periodic table in the exam.</p><div class="tablewrap"><table><thead><tr><th>Z</th><th>Symbol</th><th>Element</th><th>Rounded Aᵣ</th><th>Group</th><th>Period</th><th>Shells</th></tr></thead><tbody>${elements.map(([s,n,z,m,g,p,e])=>`<tr><td>${z}</td><td><b>${s}</b></td><td>${n}</td><td>${m}</td><td>${g}</td><td>${p}</td><td>${e}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>Definitions to practise aloud</h2><label class="noprint" for="definition-search">Find a definition</label><input class="noprint" id="definition-search" placeholder="Try isotope, mole or bond" oninput="filterDefinitions(this.value)"><dl id="definitions">${definitionRows('')}</dl></div>${sourceBox()}`)}
function definitionRows(query){return glossary.filter(([a,b])=>(a+' '+b).toLowerCase().includes(query.toLowerCase())).map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')||'<p>No matching definition. Try a different word.</p>'}
function filterDefinitions(q){document.querySelector('#definitions').innerHTML=definitionRows(q)}
function examItem(q){const value=examAnswers[q.id];return `<div class="examitem"><div class="qheading"><label for="ex-${q.id}"><b>${q.id}</b> ${esc(q.q)}</label><span class="marks">(${q.marks})</span></div>${q.type==='mc'?`<div class="examchoices">${q.options.map((o,i)=>`<label><input type="radio" name="ex-${q.id}" value="${i}" ${value===i?'checked':''} onchange="setExamAnswer('${q.id}',${i})"> <span>${'ABCD'[i]}. ${esc(o)}</span></label>`).join('')}</div>`:q.type==='number'?`<div class="numberrow"><input id="ex-${q.id}" type="text" inputmode="decimal" value="${esc(value)}" placeholder="Final answer" oninput="setExamAnswer('${q.id}',this.value)"><span class="unit">${esc(q.unit)}</span></div>`:`<textarea id="ex-${q.id}" rows="3" placeholder="Write your answer here; use paper for diagrams and working." oninput="setExamAnswer('${q.id}',this.value)">${esc(value)}</textarea>`}</div>`}
function setExamAnswer(id,value){examAnswers[id]=value}
function showExam(){if(examSubmitted){showMemo();return}page('Chemistry mock examination','Grade 10 · Paper 2 · 100 marks','exam',`<div class="panel"><h2>Write first. Mark afterwards.</h2><p><b>Suggested time: 2 hours.</b> Q1 is 10 multiple-choice marks. The remaining 90 marks cover definitions, explanations, drawings and calculations. This is an original revision paper.</p><p>Answer below or on paper. Show calculation working and draw Lewis diagrams on paper. Use the periodic-table reference and the constants given in each question. Round final calculations to two decimal places where appropriate.</p><p class="note">The memo checks multiple-choice and final numerical answers. Written responses, diagrams and method marks need your own marking against the rubric. This is not AI marking. Exam answers stay on this page during navigation, but are not saved after closing or reloading it.</p></div>${exam.map(g=>`<section class="panel examgroup"><h2>${esc(g.title)} <span class="tag">[${g.marks} marks]</span></h2><p>${esc(g.intro)}</p>${g.items.map(examItem).join('')}</section>`).join('')}<div class="actions noprint"><button class="btn" onclick="submitExam()">Finish and open memo →</button><button class="btn secondary" onclick="window.print()">Print question paper</button></div>`)}
function submitExam(){const unanswered=exam.flatMap(g=>g.items).filter(q=>examAnswers[q.id]===undefined||String(examAnswers[q.id]).trim()==='').length;if(unanswered&&!confirm(`${unanswered} answers are blank. Open the memo anyway? You can still mark work done on paper.`))return;examScores={};for(const q of exam.flatMap(g=>g.items)){const v=examAnswers[q.id];if(q.type==='mc')examScores[q.id]=v===q.answer?q.marks:0;else if(q.type==='number'){const n=parseAnswer(v??'');examScores[q.id]=Number.isFinite(n)&&Math.abs(n-q.answer)<=q.tolerance?q.marks:0}}examSubmitted=true;showMemo()}
function markSelect(q){const score=examScores[q.id];return `<label class="noprint scorepicker">Your marks <select aria-label="Marks for question ${q.id}" onchange="setExamScore('${q.id}',this.value)"><option value="" ${score===undefined?'selected':''}>Mark this answer</option>${Array.from({length:q.marks+1},(_,i)=>`<option value="${i}" ${score===i?'selected':''}>${i} / ${q.marks}</option>`).join('')}</select></label>`}
function memoItem(q){const raw=examAnswers[q.id];const user=q.type==='mc'?(raw===undefined?'Not answered':q.options[raw]):(String(raw??'').trim()||'Not entered / completed on paper');const answer=q.type==='mc'?q.options[q.answer]:q.type==='number'?formatAnswer(q):q.answer;return `<div class="examitem memocard"><div class="qheading"><b>${q.id} · ${esc(q.q)}</b><span class="marks">(${q.marks})</span></div><p class="muted useranswer">Your answer: ${esc(user)}</p><div class="worked"><b>Memo: ${esc(answer)}</b>${q.steps?'<ol>'+q.steps.map(s=>'<li>'+esc(s)+'</li>').join(''):'<p>'+esc(q.why)+'</p>'}${q.id==='5.3'?diagram('water'):''}</div>${markSelect(q)}</div>`}
function showMemo(){page('Your memo & marking','100 marks · worked methods','exam',`<div class="panel"><h2 id="exam-score" aria-live="polite"></h2><p>Multiple-choice and numerical answers have suggested scores. Check your working against the steps below and adjust method marks where appropriate. Award written and drawing marks yourself using the rubric. The score is provisional until every answer is marked.</p><p class="note">A correct final number does not prove that you showed the required method. Likewise, an incorrect number can still earn method marks. Use the mark selectors honestly; the computer does not assess written working.</p><div class="actions noprint"><button class="btn secondary small" onclick="window.print()">Print memo</button><button class="btn secondary small" onclick="restartExam()">Restart mock exam</button><button class="btn secondary small" onclick="home()">Learning path</button></div></div>${exam.map(g=>`<section class="panel"><h2>${esc(g.title)} <span class="tag">[${g.marks} marks]</span></h2>${g.items.map(memoItem).join('')}</section>`).join('')}`);updateExamScore()}
function setExamScore(id,value){if(value==='')delete examScores[id];else examScores[id]=Number(value);updateExamScore()}
function updateExamScore(){const qs=exam.flatMap(g=>g.items),left=qs.filter(q=>examScores[q.id]===undefined).length,total=Object.values(examScores).reduce((a,b)=>a+b,0);document.querySelector('#exam-score').textContent=(left?'Provisional score: ':'Your score: ')+total+' / 100'+(left?' · '+left+' answers still to mark':'')}
function restartExam(){if(confirm('Clear the current mock answers and marks, and start again?')){examAnswers={};examScores={};examSubmitted=false;showExam()}}
function diagram(type){const wrapper=(svg,caption)=>`<figure class="diagram">${svg}<figcaption>${caption}</figcaption></figure>`;
if(type==='heating')return wrapper(`<svg viewBox="0 0 600 250" role="img" aria-label="Example heating curve with temperature rising, melting plateau, rising liquid, boiling plateau, then rising gas"><path d="M55 20V205H575" fill="none" stroke="#514b60" stroke-width="2"/><path d="M65 190L145 150H235L345 70H455L535 25" fill="none" stroke="#694da5" stroke-width="4"/><g fill="#514b60" font-size="13"><text x="75" y="160">solid</text><text x="155" y="173">melting</text><text x="267" y="92">liquid</text><text x="366" y="95">boiling</text><text x="490" y="61">gas</text><text x="220" y="235">Time / energy supplied →</text><text x="10" y="150" transform="rotate(-90 10 150)">Temperature →</text></g></svg>`,'Schematic for a pure substance at constant pressure. Slopes warm one phase; plateaus show phase changes. Not drawn to scale.');
if(type==='water')return wrapper(`<svg viewBox="0 0 400 170" role="img" aria-label="Water Lewis structure: central oxygen has one shared pair with each hydrogen and two lone pairs"><g font-family="Arial,sans-serif" font-size="34" fill="#30263f" text-anchor="middle"><text x="100" y="95">H</text><text x="200" y="95">O</text><text x="300" y="95">H</text></g><g fill="#694da5"><circle cx="146" cy="76" r="4"/><circle cx="146" cy="89" r="4"/><circle cx="254" cy="76" r="4"/><circle cx="254" cy="89" r="4"/><circle cx="193" cy="45" r="4"/><circle cx="207" cy="45" r="4"/><circle cx="193" cy="119" r="4"/><circle cx="207" cy="119" r="4"/></g><text x="200" y="155" fill="#645b70" text-anchor="middle" font-size="13">Two bonding pairs + two lone pairs = 8 electrons</text></svg>`,'Lewis electron-dot model of H₂O. The straight layout shows connectivity, not the molecule’s actual bent shape.');
if(type==='ionic')return wrapper(`<svg viewBox="0 0 500 155" role="img" aria-label="Sodium loses one electron, chlorine gains it, forming Na plus and Cl minus with eight valence electrons"><g fill="#30263f" font-size="28" text-anchor="middle"><text x="55" y="77">Na</text><text x="138" y="77">Cl</text><text x="237" y="77">→</text><text x="323" y="77">[Na]⁺</text><text x="429" y="77">Cl</text><text x="489" y="35" font-size="19">−</text></g><g fill="#694da5"><circle cx="85" cy="67" r="3"/><circle cx="129" cy="40" r="3"/><circle cx="143" cy="40" r="3"/><circle cx="129" cy="96" r="3"/><circle cx="143" cy="96" r="3"/><circle cx="106" cy="62" r="3"/><circle cx="106" cy="76" r="3"/><circle cx="169" cy="67" r="3"/><circle cx="422" cy="40" r="3"/><circle cx="436" cy="40" r="3"/><circle cx="422" cy="96" r="3"/><circle cx="436" cy="96" r="3"/><circle cx="397" cy="61" r="3"/><circle cx="397" cy="77" r="3"/><circle cx="461" cy="61" r="3"/><circle cx="461" cy="77" r="3"/></g><path d="M393 26h-9v82h9M467 26h9v82h-9" fill="none" stroke="#30263f" stroke-width="2"/><text x="250" y="135" text-anchor="middle" fill="#645b70" font-size="13">Electron transfer forms ions; opposite ions attract.</text></svg>`,'Simplified Lewis model. Final Na⁺ has lost its outer electron; Cl⁻ has eight valence electrons. Only valence electrons are shown.');
if(type==='orbitals')return wrapper(`<svg viewBox="0 0 500 160" role="img" aria-label="Nitrogen orbital diagram: 1s and 2s each contain paired opposite spins; three 2p orbitals each contain one upward spin"><g fill="none" stroke="#694da5" stroke-width="2"><rect x="40" y="38" width="65" height="55"/><rect x="148" y="38" width="65" height="55"/><rect x="270" y="38" width="55" height="55"/><rect x="325" y="38" width="55" height="55"/><rect x="380" y="38" width="55" height="55"/></g><g fill="#30263f" text-anchor="middle" font-size="29"><text x="72" y="76">↑↓</text><text x="180" y="76">↑↓</text><text x="297" y="76">↑</text><text x="352" y="76">↑</text><text x="407" y="76">↑</text></g><g fill="#645b70" font-size="15" text-anchor="middle"><text x="72" y="118">1s²</text><text x="180" y="118">2s²</text><text x="352" y="118">2p³</text><text x="250" y="148">Nitrogen (Z = 7): singly fill equal-energy p orbitals before pairing.</text></g></svg>`,'Each box is an orbital. At most two electrons with opposite spins may share a box.');return ''}
document.addEventListener('keydown',e=>{if(stage==='question'&&e.key==='Enter'){const b=document.querySelector('#check');if(b&&!b.disabled){e.preventDefault();b.click()}}if(stage==='question'&&!answered&&/^[1-4]$/.test(e.key)&&document.activeElement?.tagName!=='INPUT'){const q=session.qs[session.at];if(q.options)selectAnswer(q.order[Number(e.key)-1])}});
home();

</script></body></html>
